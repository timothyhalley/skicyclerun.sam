AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: |
  skicyclerunAPI: function library
Metadata:
  com:
    aws:
      cloudformation:
        Context:
          arch: >-
            API Gateway routes public and Cognito-authorized requests to Lambda
            functions. Handlers read protected content from S3; the auth handler
            integrates with Cognito and sends verification messages through SMS
            and SES. A CloudFront Function rewrites pretty URLs to index.html.
Globals:
  Function:
    Timeout: 3
    Runtime: nodejs22.x
    MemorySize: 3008
    Environment:
      Variables:
        ALLOWED_ORIGINS: { Ref: AllowedOrigins }
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: ERROR
      SystemLogLevel: WARN

Parameters:
  UserPoolArn:
    Type: String
    Description: ARN of the Cognito User Pool for authorizing protected routes
  UserPoolClientId:
    Type: String
    Description: Cognito User Pool App Client ID for USER_AUTH passwordless flow
  AllowedOrigins:
    Type: String
    Default: "https://skicyclerun.com,https://dev.skicyclerun.com,http://localhost:4321,https://localhost:4321"
    Description: Comma-separated list of allowed origins for CORS
  ProtectedContentBucket:
    Type: String
    Description: S3 bucket name that stores protected post bodies

Resources:
  # CloudFront Function for URI rewriting (pretty URLs)
  UriRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-uri-rewrite"
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          // Skip if already requesting a file with extension
          if (uri.includes('.')) {
            return request;
          }

          // Add index.html to directory requests
          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else {
            // Add trailing slash and index.html for pretty URLs
            request.uri += '/index.html';
          }

          return request;
        }
      FunctionConfig:
        Comment: "Rewrite pretty URLs to index.html for skicyclerun.com"
        Runtime: cloudfront-js-2.0

  PublicApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: { Ref: UserPoolArn }
            Identity:
              Header: Authorization

  EchoEchoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: EchoEcho/
      Handler: app.lambdaHandler
      # No explicit policies needed; SAM will create a basic execution role
      Events:
        Welcome:
          Type: Api
          Properties:
            Path: /echoecho
            Method: get
            RestApiId: { Ref: PublicApi }
        WelcomeOptions:
          Type: Api
          Properties:
            Path: /echoecho
            Method: options
            RestApiId: { Ref: PublicApi }
      MemorySize: 3008
      Timeout: 30

  EchoEchoFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EchoEchoFunction}"
      RetentionInDays: 3

  WelcomeMsgFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: WelcomeMsg/
      Handler: app.lambdaHandler
      # No explicit policies needed; SAM will create a basic execution role
      Events:
        Welcome:
          Type: Api
          Properties:
            Path: /welcome
            Method: get
            RestApiId: { Ref: PublicApi }
        WelcomeOptions:
          Type: Api
          Properties:
            Path: /welcome
            Method: options
            RestApiId: { Ref: PublicApi }
      MemorySize: 3008
      Timeout: 30

  WelcomeMsgFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WelcomeMsgFunction}"
      RetentionInDays: 3

  RandomFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: RandomNumber/
      Handler: app.lambdaHandler
      # No explicit policies needed; SAM will create a basic execution role
      Events:
        Welcome:
          Type: Api
          Properties:
            Path: /random
            Method: get
            RestApiId: { Ref: PublicApi }
        WelcomeOptions:
          Type: Api
          Properties:
            Path: /random
            Method: options
            RestApiId: { Ref: PublicApi }
      MemorySize: 3008
      Timeout: 30

  RandomFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RandomFunction}"
      RetentionInDays: 3

  GetBucketKeyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: getBucketkey/
      Handler: app.lambdaHandler
      Policies:
        - S3ReadPolicy:
            BucketName: { Ref: ProtectedContentBucket }
      Events:
        Welcome:
          Type: Api
          Properties:
            Path: /getkey
            Method: get
            RestApiId: { Ref: PublicApi }
        WelcomeOptions:
          Type: Api
          Properties:
            Path: /getkey
            Method: options
            RestApiId: { Ref: PublicApi }
      MemorySize: 3008
      Timeout: 30

  GetBucketKeyFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetBucketKeyFunction}"
      RetentionInDays: 3

  GetAlbumsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: getAlbums/
      Handler: app.lambdaHandler
      Policies:
        - S3ReadPolicy:
            BucketName: { Ref: ProtectedContentBucket }
      Events:
        Welcome:
          Type: Api
          Properties:
            Path: /getalbums
            Method: get
            RestApiId: { Ref: PublicApi }
        WelcomeOptions:
          Type: Api
          Properties:
            Path: /getalbums
            Method: options
            RestApiId: { Ref: PublicApi }
      MemorySize: 3008
      Timeout: 30

  GetAlbumsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetAlbumsFunction}"
      RetentionInDays: 3

  GetAlbumPhotosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: getPhotos/
      Handler: app.lambdaHandler
      Policies:
        - S3ReadPolicy:
            BucketName: { Ref: ProtectedContentBucket }
      Events:
        Welcome:
          Type: Api
          Properties:
            Path: /getphotos
            Method: get
            RestApiId: { Ref: PublicApi }
        WelcomeOptions:
          Type: Api
          Properties:
            Path: /getphotos
            Method: options
            RestApiId: { Ref: PublicApi }
      MemorySize: 3008
      Timeout: 30

  GetAlbumPhotosFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetAlbumPhotosFunction}"
      RetentionInDays: 3

  GetAlbumPhotosRNDFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: getPhotosRandom/
      Handler: app.lambdaHandler
      Policies:
        - S3ReadPolicy:
            BucketName: { Ref: ProtectedContentBucket }
      Events:
        Welcome:
          Type: Api
          Properties:
            Path: /getphotosrandom
            Method: get
            RestApiId: { Ref: PublicApi }
        WelcomeOptions:
          Type: Api
          Properties:
            Path: /getphotosrandom
            Method: options
            RestApiId: { Ref: PublicApi }
      MemorySize: 3008
      Timeout: 30

  GetAlbumPhotosRNDFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetAlbumPhotosRNDFunction}"
      RetentionInDays: 3

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: Status/
      Handler: app.lambdaHandler
      Environment:
        Variables:
          ALLOWED_ORIGINS: { Ref: AllowedOrigins }
      Events:
        Status:
          Type: Api
          Properties:
            Path: /status
            Method: get
            RestApiId: { Ref: PublicApi }
        StatusOptions:
          Type: Api
          Properties:
            Path: /status
            Method: options
            RestApiId: { Ref: PublicApi }
      MemorySize: 512
      Timeout: 10

  StatusFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StatusFunction}"
      RetentionInDays: 3

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: Profile/
      Handler: app.lambdaHandler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
              Resource: { Ref: UserPoolArn }
      Environment:
        Variables:
          ALLOWED_ORIGINS: { Ref: AllowedOrigins }
          USER_POOL_ID: "us-west-2_nkPiRBTSr"
      Events:
        Profile:
          Type: Api
          Properties:
            Path: /profile
            Method: get
            RestApiId: { Ref: PublicApi }
            Auth:
              Authorizer: CognitoAuthorizer
        ProfileOptions:
          Type: Api
          Properties:
            Path: /profile
            Method: options
            RestApiId: { Ref: PublicApi }
      MemorySize: 512
      Timeout: 10

  ProfileFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProfileFunction}"
      RetentionInDays: 3

  # Cognito-native passwordless auth handler
  NotifyAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      CodeUri: notify-auth/
      Handler: handler.handler
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          USER_POOL_CLIENT_ID: { Ref: UserPoolClientId }
          USER_POOL_ARN: { Ref: UserPoolArn }
          NOTIFY_CONFIGURATION_ID: notify-96a1d17ccf3c4a408504252774c9ff6e
          NOTIFY_TEMPLATE_ID: notify-code-verification-english-001
          FROM_EMAIL: "noreply@skicyclerun.com"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:RespondToAuthChallenge
                - cognito-idp:ListUsers
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminListGroupsForUser
              Resource: { Ref: UserPoolArn }
            - Effect: Allow
              Action:
                - sms-voice:SendTextMessage
                - sms-voice:SendNotifyTextMessage
                - sms-voice:DescribeNotifyConfigurations
                - sms-voice:DescribeNotifyTemplates
              Resource: "*"
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        SendOtp:
          Type: Api
          Properties:
            Path: /auth/send-otp
            Method: post
            RestApiId: { Ref: PublicApi }
        VerifyOtp:
          Type: Api
          Properties:
            Path: /auth/verify-otp
            Method: post
            RestApiId: { Ref: PublicApi }
        VerifyOtpOptions:
          Type: Api
          Properties:
            Path: /auth/verify-otp
            Method: options
            RestApiId: { Ref: PublicApi }

  NotifyAuthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NotifyAuthFunction}"
      RetentionInDays: 3

  SendOtpPreflightFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      CodeUri: preflight-send-otp/
      Handler: app.lambdaHandler
      MemorySize: 128
      Timeout: 5
      Events:
        SendOtpOptions:
          Type: Api
          Properties:
            Path: /auth/send-otp
            Method: options
            RestApiId: { Ref: PublicApi }

  SendOtpPreflightFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SendOtpPreflightFunction}"
      RetentionInDays: 3

Outputs:
  PublicApiBaseUrl:
    Description: Base URL for the public API
    Value:
      Fn::Sub: "https://${PublicApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
    Export:
      Name: !Sub "${AWS::StackName}-PublicApiBaseUrl"

  UriRewriteFunctionArn:
    Description: ARN of the CloudFront URI rewrite function
    Value: !GetAtt UriRewriteFunction.FunctionMetadata.FunctionARN
    Export:
      Name: !Sub "${AWS::StackName}-UriRewriteFunctionArn"
